name: Публикация свадебного сайта

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /maxim-elizaveta-wedding-2026
      NEXT_PUBLIC_SITE_URL: https://inchik3.github.io
      VITE_RSVP_SCRIPT_URL: https://script.google.com/macros/s/AKfycbx9R6eDN5WZL8ntUr-kPwIsTRC96y53xLkz3pJROsvM_mRoTJ84a7OKPiU4ZSAJglXr/exec

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Собрать статический сайт
        run: pnpm run build:github

      - name: Подготовить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузить готовый сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
